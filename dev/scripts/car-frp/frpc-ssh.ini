# frpc-ssh.ini — 小车 → 公网服务器 121.40.149.155 的 frp 客户端配置
# 部署位置：/root/frp/frpc-ssh.ini（systemd: frpc-ssh.service）
# frp 版本 0.39.0，须与服务器端 frps 0.39.0 配套（server_port=17000、token 一致）
# ★ 2026-10-08 改名：代理名 [ssh] → [car-ssh]。frps 的代理名**全局唯一**：
#   团队虚拟机 jsj-virtual-machine（frp 0.71）先注册了 [ssh]（remote_port 30022），
#   小车再注册同名 [ssh]（remote_port 2222）永远失败 → 公网 2222 起不来。
#   改小车侧名字绕开（remote_port 仍是 2222，连法不变）。备份：frpc-ssh.ini.bak-20261008。
#   以后新增代理名务必加前缀（car-）避免撞名。
#
# 三个映射：
#   2222 → 小车 sshd(22)      远程运维（隧道）
#   8080 → 小车 nginx(80)     网页控制台（含我们自建的图传 WHEP 反代）
#   80   → 小车 nginx(80)     域名直连入口 liyekai380.dpdns.org（需安全组放行 80）

[common]
server_addr = 121.40.149.155
server_port = 17000
token = 375b12b2e5614357ce8225bcce93df4e

[car-ssh]
type = tcp
local_ip = 127.0.0.1
local_port = 22
remote_port = 2222

[web-ui]
type = tcp
local_ip = 127.0.0.1
local_port = 80
remote_port = 8080

# 域名入口：http://liyekai380.dpdns.org/  （裸域名，不带端口）
# 与 web-ui 指向同一个本地服务，只是对外的远程端口不同
[web-domain]
type = tcp
local_ip = 127.0.0.1
local_port = 80
remote_port = 80
