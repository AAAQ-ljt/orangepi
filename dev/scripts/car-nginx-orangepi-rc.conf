# 小车网页 + 图传反代配置（自建服务器版）
# 部署位置：/etc/nginx/sites-enabled/orangepi-rc
# 备份：/root/dev/backup-<日期>/orangepi-rc（原始版本指向官方 82.157.204.126）
#
# 链路：浏览器 → 121.40.149.155:8080（frp）→ 本机 nginx
#         ├─ /             网页（摇杆 + 视频播放器）
#         ├─ /ws           opi-control 控制通道
#         ├─ /<流>/whep    WebRTC 拉流 → 自建 mediamtx（低延迟，网页主用）
#         └─ /hls/...      HLS 兜底播放 → 自建 mediamtx
server {
    listen 80;
    server_name _;

    root /var/www/orangepi-rc;
    index index.html index_main.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 遥控指令通道（opi-control）
    location /ws {
        proxy_pass http://127.0.0.1:9001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # WebRTC 拉流（网页用 WHEP）：指向自建 mediamtx，不再用官方媒体服务器
    location ~ ^/[^/]+/whep(/|$) {
        proxy_pass http://121.40.149.155:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # WebRTC 推流（语音对讲，预留）
    location ~ ^/[^/]+/whip(/|$) {
        proxy_pass http://121.40.149.155:8889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # HLS 兜底：http://<本机地址>:8080/hls/cam_car0027/index.m3u8
    location /hls/ {
        proxy_pass http://121.40.149.155:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
