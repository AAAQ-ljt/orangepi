# ============================================================================
# 小车网络配置（唯一入口）
# 改完执行： bash /root/dev/scripts/net/car-net.sh apply
# ============================================================================

# ---- 上电策略：先流量卡，没有再 WiFi；任一连上后不再尝试另一路 ----
PREFER_CELLULAR=yes          # yes=蜂窝优先；no=WiFi 优先
WIFI_FALLBACK=yes            # 蜂窝失败时是否用 WiFi 兜底
CELL_TIMEOUT=30              # 等待蜂窝拿到 IP 并出网的最长秒数
WIFI_TIMEOUT=45              # WiFi 连接超时秒数
WIFI_LEDGER=/root/dev/scripts/net/wifi-ledger.conf

# ---- 蜂窝拨号 ----
# 轮询尝试，第一个成功的就用（插别的卡也能连）。
# 实测本车卡是联通 → 3gnet 可通、cmnet 会 CID 超时，所以 3gnet 放最前（2026-09-16）
APN_LIST="3gnet,cmnet,ctnet,cmwap,uninet,internet"
CELL_METRIC=100              # 路由优先级：数字小优先（蜂窝 100 < WiFi 600）
WIFI_METRIC=600
VENDOR_DIAL_FALLBACK=yes     # APN 轮询都失败时，是否再用厂商 simcom-cm 兜底
MODEM_HARD_RESET=yes         # 还不行就 USB 硬复位模组（等价重插）后重试 —— 最后的兜底
MODEM_USB_ID=""              # 模组 USB 设备（sysfs 名如 2-1）；留空自动按 idVendor 1e0e 探测

# ---- 服务器端点（换服务器只改这几行，然后 car-net.sh apply）----
# 媒体服务器（图传）
MEDIA_RTSP="rtsp://car:Ct7vL92xQm4@121.40.149.155:8554"
# frp 隧道服务器（SSH + 网页控制台）
FRP_SERVER_ADDR=121.40.149.155
FRP_SERVER_PORT=17000
FRP_TOKEN="375b12b2e5614357ce8225bcce93df4e"
FRP_SSH_PORT=2222            # 服务器上映射给小车 22 的端口
FRP_WEB_PORT=8080            # 服务器上映射给小车 80 的端口（网页控制台）
FRP_DOMAIN_PORT=80           # 服务器上映射给小车 80 的端口（裸域名入口，可留空不用）

# ---- 本机接口（一般不用改）----
WIFI_IF=wlx0013eff2002b      # USB WiFi 网卡（2026-09-20 实测名；换网卡后此名会变，
                             #   查法：nmcli -t -f DEVICE,TYPE dev status | grep wifi）
WWAN_IF=wwan0                # 5G 模组网卡
QMI_DEV=/dev/cdc-wdm0        # QMI 控制口
