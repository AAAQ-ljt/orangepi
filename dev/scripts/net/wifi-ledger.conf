# ============================================================================
# WiFi 连接账本：要连哪个热点，就在这里写一行（用户可直接编辑）
#
# 格式：  SSID|密码|优先级
#   - SSID 可以含空格
#   - 优先级：数字越小越优先（不写默认 50）
#   - 以 # 开头的是注释；空行忽略
#   - 密码为空的条目会被跳过（除非系统里已经有同名配置），避免写错密码把能用的连接搞坏
#
# 常用命令：
#   bash /root/dev/scripts/net/car-net.sh wifi export   # 把车上已有的 WiFi 导出到本账本
#   bash /root/dev/scripts/net/car-net.sh wifi sync     # 把本账本同步成 NetworkManager 配置
#   bash /root/dev/scripts/net/car-net.sh wifi list     # 看账本 + 当前能搜到的热点
#
# 注意：比赛阶段用手机热点属于"局域网"，裁判可能按规则罚时（+200s）。
#       比赛时请确保流量卡可用，WiFi 只作开发期兜底。
# ============================================================================

# 示例（把 # 去掉并填上真实的 SSID 和密码即可）：
# 我的手机热点|12345678|10
# 实验室AP|password|20
